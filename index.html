<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>无情的赚钱机器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; font-family: -apple-system, system-ui, sans-serif; }
        .glass-card { 
            background: rgba(30, 30, 30, 0.6); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* 直观的输入框样式 */
        .control-panel {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .input-pill {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(250, 204, 21, 0.2);
            border-radius: 12px;
            color: #fbbf24;
            font-weight: 800;
            text-align: center;
            height: 40px;
            width: 100%;
            outline: none;
            transition: all 0.3s;
        }
        .input-pill:focus {
            border-color: #fbbf24;
            box-shadow: 0 0 10px rgba(250, 204, 21, 0.2);
        }
        .label-text {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 6px;
            display: block;
            font-weight: 600;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-5 text-slate-100">

    <div class="glass-card w-full max-w-sm rounded-[2.5rem] p-6 shadow-2xl relative overflow-hidden">
        
        <div class="absolute -top-10 -left-10 w-32 h-32 bg-yellow-500/10 rounded-full blur-3xl"></div>

        <div class="text-center mb-6">
            <h1 class="text-xl font-black italic tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-500">
                无情的赚钱机器
            </h1>
        </div>

        <div class="control-panel mb-6 space-y-4">
            <div>
                <span class="label-text text-center">月薪预设 (Monthly Salary)</span>
                <input id="sal" type="number" value="15000" class="input-pill" oninput="update()">
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <span class="label-text text-center">上班 (Start)</span>
                    <input id="startTime" type="time" value="09:00" class="input-pill" oninput="update()">
                </div>
                <div>
                    <span class="label-text text-center">下班 (End)</span>
                    <input id="endTime" type="time" value="18:00" class="input-pill" oninput="update()">
                </div>
            </div>
        </div>

        <div class="bg-gradient-to-b from-black/60 to-black/20 rounded-[2rem] py-10 px-2 border border-white/5 text-center mb-6 relative">
            <div class="absolute top-4 left-1/2 -translate-x-1/2 w-12 h-1 bg-white/5 rounded-full"></div>
            <span class="text-[9px] font-bold text-yellow-500/50 tracking-[0.4em] uppercase block mb-2">Real-time Revenue</span>
            <div id="moneyDisplay" class="text-4xl font-black tracking-tighter text-white tabular-nums drop-shadow-2xl">
                ¥0.0000
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white/[0.02] rounded-2xl p-4 border border-white/5">
                <span class="label-text">今日进度</span>
                <div id="percentDisplay" class="text-lg font-bold text-white italic">0%</div>
            </div>
            <div class="bg-white/[0.02] rounded-2xl p-4 border border-white/5">
                <span class="label-text">已赚午饭</span>
                <div id="lunchDisplay" class="text-lg font-bold text-yellow-500 italic text-right">0.0 顿</div>
            </div>
        </div>

        <p class="text-[8px] text-center opacity-20 mt-6 tracking-widest uppercase italic">The machine has no feelings.</p>
    </div>

    <script>
        function update() {
            const salary = parseFloat(document.getElementById('sal').value) || 0;
            const startStr = document.getElementById('startTime').value;
            const endStr = document.getElementById('endTime').value;

            const [sh, sm] = startStr.split(':');
            const [eh, em] = endStr.split(':');
            
            const startTime = new Date(); startTime.setHours(sh, sm, 0);
            const endTime = new Date(); endTime.setHours(eh, em, 0);
            
            const dailyPay = salary / 21.75;

            if (now < startTime) {
                render(0, 0);
