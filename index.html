<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>无情的赚钱机器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #080808; font-family: sans-serif; color: white; }
        .glass { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; }
        .input-pill { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; color: #fbbf24; text-align: center; height: 40px; width: 100%; outline: none; font-weight: bold; }
        .btn-confirm { background: #fbbf24; color: black; font-weight: bold; border-radius: 10px; padding: 10px; width: 100%; }
        .quote-active:active { transform: scale(0.95); opacity: 0.7; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="glass w-full max-w-sm p-6 shadow-2xl">
        <h1 class="text-xl font-black italic text-center mb-6 tracking-tighter">无情的赚钱机器</h1>

        <div class="space-y-4 mb-6">
            <div>
                <label class="text-[10px] opacity-40 block mb-1 font-bold">月薪 (RMB)</label>
                <input id="sal" type="number" value="15000" class="input-pill">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-[10px] opacity-40 block mb-1 font-bold">上班</label>
                    <input id="startTime" type="time" value="09:00" class="input-pill">
                </div>
                <div>
                    <label class="text-[10px] opacity-40 block mb-1 font-bold">下班</label>
                    <input id="endTime" type="time" value="18:00" class="input-pill">
                </div>
            </div>
            <button id="startBtn" onclick="run()" class="btn-confirm">确认并开启监控</button>
        </div>

        <div class="bg-black/40 rounded-3xl py-10 text-center mb-6 border border-white/5">
            <span class="text-[10px] text-yellow-500/50 font-bold uppercase tracking-widest">Revenue Status</span>
            <div id="money" class="text-5xl font-black tabular-nums my-2">¥0.00</div>
        </div>

        <div class="text-center px-4 mb-8 quote-active" onclick="newQuote()">
            <span class="text-[9px] opacity-20 block mb-1 italic">—— 点击切换语录 ——</span>
            <p id="quote" class="text-sm font-bold text-yellow-500/90 italic">“ 别看了，再看老板也不会给你加薪 ”</p>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white/5 p-4 rounded-2xl text-center">
                <span class="text-[9px] opacity-30 block mb-1">今日进度</span>
                <span id="perc" class="text-lg font-bold">0%</span>
            </div>
            <div class="bg-white/5 p-4 rounded-2xl text-center">
                <span class="text-[9px] opacity-30 block mb-1">已赚午饭</span>
                <span id="lunch" class="text-lg font-bold text-yellow-300">0 顿</span>
            </div>
        </div>
    </div>

    <script>
        const quotes = [
            "每一秒的坚持，都是在合法抢老板的钱。",
            "钱可以慢慢赚，班必须准时下。",
            "身体在搬砖，灵魂在马尔代夫。",
            "莫得感情，我只是一个财富搬运工。",
            "只要你足够努力，老板明年就能换劳斯莱斯。",
            "没钱的时候，连呼吸都是错的。",
            "打工是不可能打工的，这辈子都在合法‘偷’工资。",
            "今日搬砖进度：已完成‘准点下班’的思想建设。",
            "别跟我谈梦想，我的梦想是不上班。",
            "生活已经很苦了，能赚一点是一点。"
        ];

        function newQuote() {
            document.getElementById('quote').innerText = `“ ${quotes[Math.floor(Math.random()*quotes.length)]} ”`;
        }

        function run() {
            document.getElementById('startBtn').innerText = "监控运行中...";
            document.getElementById('startBtn').style.opacity = "0.5";
            setInterval(update, 100);
        }

        function update() {
            const salary = parseFloat(document.getElementById('sal').value) || 0;
            const startStr = document.getElementById('startTime').value;
            const endStr = document.getElementById('endTime').value;
            const now = new Date();
            const [sh, sm] = startStr.split(':');
            const [eh, em] = endStr.split(':');
            const st = new Date(); st.setHours(sh, sm, 0);
            const et = new Date(); et.setHours(eh, em, 0);
            const daily = salary / 21.75;

            let earned = 0, progress = 0;
            if (now >= st && now <= et) {
                progress = (now - st) / (et - st);
                earned = progress * daily;
            } else if (now > et) {
                earned = daily; progress = 1;
            }

            document.getElementById('money').innerText = `¥${earned.toFixed(2)}`;
            document.getElementById('perc').innerText = `${(progress*100).toFixed(1)}%`;
            document.getElementById('lunch').innerText = `${(earned/30).toFixed(1)} 顿`;
        }
    </script>
</body>
</html>
